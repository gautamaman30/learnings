<!DOCTYPE html>
<html>
<head>
    <title>Meet Audio Interceptor</title>
    <style>
        body {
            width: 300px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            background-color: #f0f0f0;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            padding: 8px;
            border: none;
            border-radius: 4px;
            background-color: #4285f4;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #3367d6;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Meet Audio Interceptor</h2>
        <div class="status" id="status">
            Status: Checking...
        </div>
        <div class="controls">
            <div class="volume-control">
                <label for="volume">Volume:</label>
                <input type="range" id="volume" min="0" max="100" value="100">
            </div>
            <button id="toggleProcessing">Toggle Processing</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
